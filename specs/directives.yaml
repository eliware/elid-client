version: "15.0"
description: Local requirements for the EliD OAuth and OpenID Connect client library.
directives:
  - id: E-1331.0
    dos:
      - Build `@eliware/elid-client` as the shared Node.js client for EliD applications.
      - >-
        Describe the package as a Node.js server-side OAuth and OpenID Connect client for EliD
        applications.
      - Support Node.js server-side OAuth clients and backends for frontend applications.
      - >-
        Keep the library framework-neutral and provide server-side protocol operations and
        transaction validation.
      - >-
        Configure the issuer, client ID, redirect URI, scopes, and resource for each application
        at runtime.
      - Give each application a distinct client and an exact registered redirect URI.
      - Keep domain routing and login branding in EliD configuration.
      - Follow RFC 9700 and RFC 10017 for OAuth and browser application guidance.
      - Use OpenID Connect when an application signs in a user.
      - >-
        Allow OAuth-only scope sets without `openid` for API access without user sign-in.
      - Follow the OAuth 2.1 Internet-Draft while it remains a draft.
      - Use Authorization Code with PKCE S256 for interactive sign-in.
      - Create one-time state, nonce, and PKCE verifier values for OpenID Connect transactions.
      - Create one-time state and a PKCE verifier for OAuth-only transactions.
      - >-
        Include the OIDC nonce parameter only when configured scopes include `openid`.
      - >-
        Store transaction values in one-time application state and require exact redirect URI
        matches.
      - Read issuer metadata and verify an exact match with the configured issuer.
      - Use only endpoints and capabilities from verified issuer metadata.
      - Cache metadata and signing keys safely, and support rotated JWKS keys.
      - Verify ID Token signatures with issuer JWKS and supported algorithms.
      - >-
        Validate ID Token issuer, audience, `azp` when required, expiration, issue time, and
        nonce when configured scopes include `openid`.
      - >-
        Accept OAuth token responses without an ID Token when configured scopes omit `openid`.
      - Use the `(issuer, subject)` pair as the stable account identity.
      - Keep optional profile claims as provider data, not guaranteed fields.
      - Do not inspect or decode access token contents to identify users or infer audiences.
      - Use UserInfo for identity claims that EliD supports and documents.
      - Send the RFC 8707 resource value when the target API requires an audience-bound token.
      - Support rotated refresh tokens and reject replay, expiry, and revocation errors safely.
      - Allow refreshed ID Tokens to omit `nonce`.
      - Reject a refreshed ID Token when its `nonce` differs from the initial value.
      - >-
        Provide token revocation through the discovered endpoint and advertised client
        authentication methods.
      - >-
        Keep token introspection outside this client library because it belongs to
        resource-server behavior.
      - Use `@eliware/mcp-server` for its supported MCP protected-resource behavior.
      - Separate application sign-in from authorization to call MCP or HTTP resources.
      - >-
        Preserve resource indicators, scopes, and audience checks when applications call
        protected resources.
      - >-
        Keep `docs/` focused on end-user installation, configuration, API, and usage guidance.
      - >-
        Keep user provisioning, application roles, routes, and authorization policy in each
        owning application.
      - Add timeouts, response checks, safe retries where allowed, and typed protocol errors.
      - >-
        Redact diagnostics and exclude credentials, authorization codes, tokens, verifiers, and
        user input from logs.
      - Use `@eliware/log` 15.0.1 with an injectable logger and structured operation context.
      - >-
        Replace the greeting sample with focused native ESM modules and align exports with
        declarations.
      - >-
        Mirror source modules under `tests/` and align tests, specifications, documentation, and
        examples.
      - Add a reproducible local smoke setup with disposable MariaDB and verified TLS.
      - >-
        Keep production credentials out of smoke setup and production issuers out of automated
        tests.
      - Keep package metadata at 15.0.1 and release notes to one initial baseline section.
      - >-
        Run `npm ci`, `npm test`, `npm run typecheck`, and `npm run pack` before release
        consideration.
      - Publish only through the approved Operations release handoff.
    donts:
      - >-
        Do not include consumer migration inventories or repository development instructions in
        `docs/`.
      - Do not ship browser OAuth code, browser UI, or application session storage.
      - Do not claim that package metadata provides application session management.
      - Do not expose client secrets or server-held tokens to browser JavaScript.
      - Do not require an application-specific web framework or session architecture.
      - Do not add implicit, hybrid, or resource-owner-password flows.
      - >-
        Do not hardcode application domains or require shared client credentials across
        applications.
      - Do not include client registration or issuer administration in this library.
      - Do not decode access tokens to identify users or infer token audiences.
      - Do not add resource-server validation or token introspection to this client library.
      - Do not duplicate MCP resource-server validation in this client library.
      - Do not combine MCP authorization with user sign-in.
      - >-
        Do not move application routes, cookie policy, CSRF protection, session storage, or
        authorization rules into this library.
      - Do not move user provisioning or application roles into this library.
      - Do not call the greeting scaffold the finished EliD client.
      - Do not log credentials, authorization codes, tokens, verifiers, or user input.
      - Do not read production credentials or use a production issuer in automated tests.
